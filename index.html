<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Tasks</h1>
            <p id="current-date"></p>
        </header>

        <section class="input-section">
            <form id="todo-form">
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="What needs to be done?" required>
                    <select id="category-select">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" id="add-btn">Add Task</button>
                </div>
            </form>
        </section>

        <section class="filter-section">
            <div class="filter-tabs" id="status-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="category-filters" id="category-filters">
                <!-- Dynamic category filters will be injected here -->
            </div>
        </section>

        <main class="todo-list-container">
            <ul id="todo-list">
                <!-- Todo items will be injected here -->
            </ul>
            <div id="empty-state" class="hidden">
                <p>No tasks found. Start by adding one!</p>
            </div>
        </main>

        <footer>
            <div class="stats">
                <span id="items-left">0 items left</span>
            </div>
            <button id="clear-completed" class="hidden">Clear Completed</button>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
